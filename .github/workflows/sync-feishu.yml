name: Sync Feishu Wiki

# 飛書知識庫同步（workbuddy 上傳準備）。
# 帳號 / 知識庫 space 全部走 secrets，不在本檔寫死任何憑證。
#
# Secrets：
#   FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_SPACE_ID
#
# 用法：手動觸發；先用 dry_run=true 檢查 plan 輸出，確認後再關閉 dry_run 實際建立節點。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "僅列出將建立的節點（不寫入飛書）"
        type: boolean
        default: true
      manifest:
        description: "manifest CSV 路徑（repo 相對）"
        type: string
        default: "scripts/feishu-manifest.csv"

permissions:
  contents: read

concurrency:
  group: sync-feishu
  cancel-in-progress: false

jobs:
  sync-feishu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan (dry-run)
        if: ${{ inputs.dry_run }}
        run: python3 scripts/feishu-sync.py plan --manifest "${{ inputs.manifest }}"

      - name: Sync nodes
        if: ${{ !inputs.dry_run }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPACE_ID: ${{ secrets.FEISHU_SPACE_ID }}
        run: python3 scripts/feishu-sync.py sync --manifest "${{ inputs.manifest }}"
