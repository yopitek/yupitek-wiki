name: Deploy Simplified Chinese (doczhcn.yupitek.com)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "i18n/zh-CN/**"
      - "src/**"
      - "static/**"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-zh-cn
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Simplified Chinese locale
        run: npm run build:zh-cn

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=yupitek-wiki-zh-cn
